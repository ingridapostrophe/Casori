  <!-- ========== Remplissage de la page (ne pas modifier) ========== -->
  <script>
    document.querySelectorAll('[data-c]').forEach(el => {
      const cle = el.dataset.c;
      const insecable = t => t.replace(/-/g, '\u2011'); /* évite la coupure de Jean-Philippe */
      if (cle === 'prenomsPied') {
        el.textContent = '';
        el.append(insecable(CONTENU.prenom1) + ' ');
        const e = document.createElement('span'); e.className = 'esperluette-pied'; e.textContent = '&';

      else if (cle === 'prenom1' || cle === 'prenom2') el.textContent = insecable(CONTENU[cle]);
      else if (CONTENU[cle] !== undefined) el.textContent = CONTENU[cle];
    });

    document.querySelector('.photo').alt = CONTENU.photoAlt;
    document.getElementById('lien-rsvp').href = CONTENU.rsvpLien;

    const liste = document.getElementById('etapes');
    CONTENU.programme.forEach(e => {
      const li = document.createElement('li');
      li.className = 'etape';
      li.innerHTML =
        '<span class="heure"></span>' +
        '<div><h3></h3><p class="adresse"></p>' +
        (e.carte ? '<a class="carte" target="_blank" rel="noopener">Itinéraire Google Maps</a>' : '') +
        '</div>';
      li.querySelector('.heure').textContent = e.heure;
      li.querySelector('h3').textContent = e.titre;
      li.querySelector('.adresse').textContent = e.adresse;
      if (e.carte) li.querySelector('.carte').href = e.carte;
      liste.appendChild(li);
    });


    /* Images absentes : on les masque proprement */
